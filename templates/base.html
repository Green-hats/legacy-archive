<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AniVault{% endblock %}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#fff;color:#333;max-width:1200px;margin:0 auto;padding:20px}
a{color:#333}
nav{margin-bottom:20px;display:flex;gap:20px;align-items:center}
nav h1{font-size:18px}
nav a{font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{text-decoration:none}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;background:#f0f0f0;display:block}
.card .card-title{font-size:13px;margin:4px 0 2px}
.card .card-meta{font-size:11px;color:#999}
.row{display:flex;gap:20px;margin-bottom:20px}
.row .poster{width:240px;flex-shrink:0}
.row .info h2{font-size:24px;margin-bottom:4px}
.row .info .subtitle{font-size:14px;color:#666;margin-bottom:6px}
.row .info .summary{font-size:14px;line-height:1.7;margin-top:8px;color:#555}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.badge{background:#eee;padding:2px 8px;font-size:12px;color:#666}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid #eee;font-size:13px}
th{color:#999;font-weight:500;font-size:12px}
tr:hover{background:#fafafa}
.btn{padding:6px 14px;border:1px solid #ddd;background:#fff;cursor:pointer;font-size:13px}
.btn:hover{background:#f5f5f5}
.btn-sm{padding:3px 10px;font-size:12px;border:1px solid #ddd;background:#fff;cursor:pointer}
.btn-sm:hover{background:#f5f5f5}
.btn-danger{border-color:#e00;color:#e00;padding:3px 10px;font-size:12px;cursor:pointer;background:#fff}
.btn-danger:hover{background:#fee}
input{padding:6px 10px;border:1px solid #ddd;font-size:14px}
input:focus{outline:none;border-color:#999}
hr{border:none;border-top:1px solid #eee;margin:16px 0}
.search-box{display:flex;gap:8px;margin-bottom:12px}
.search-box input{flex:1}
.search-results{margin-bottom:12px}
.search-result{display:flex;gap:8px;padding:8px;cursor:pointer;border-bottom:1px solid #eee}
.search-result:hover{background:#fafafa}
.search-result.selected{background:#eef}
.search-result img{width:48px;height:64px;object-fit:cover;flex-shrink:0}
.search-result .sr-name{font-size:14px}
.search-result .sr-cn{font-size:12px;color:#999}
.manage-layout{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.section-title{font-size:14px;font-weight:600;margin-bottom:8px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;justify-content:center;align-items:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border:1px solid #ddd;width:600px;max-height:80vh;overflow-y:auto;padding:20px}
.modal h3{margin-bottom:12px;font-size:16px}
.folder-browser{margin-top:8px;max-height:300px;overflow-y:auto}
.folder-entry{padding:4px 8px;cursor:pointer;font-size:13px}
.folder-entry:hover{background:#f5f5f5}
.breadcrumb{font-size:12px;color:#999;margin-bottom:6px}
.empty{text-align:center;padding:60px 20px;color:#999}
.mapping-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:13px}
</style>
</head>
<body>
<nav>
  <h1><a href="/">AniVault</a></h1>
  <a href="/manage">管理</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
